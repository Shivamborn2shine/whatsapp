[build]
  command = "node build_netlify.js"
  publish = "dist_netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200

[[redirects]]
  from = "/workspace/*"
  to = "/workspace/index.html"
  status = 200

[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
